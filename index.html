<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="GitFinder.png" type="image/x-icon" />
    <title>GitHub User Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="titlebar-label">github-finder.sh</span>
      </div>

      <div class="content">
        <div class="prompt-line">
          <span class="caret">&gt;</span>
          <input
            type="text"
            id="username"
            placeholder="Enter GitHub username..."
            autocomplete="off"
          />
        </div>

        <button id="searchBtn">Search</button>

        <p id="loading">Searching</p>

        <div id="error"></div>

        <div id="profileCard">
          <div class="profile-header">
            <img id="avatar" src="" alt="avatar" />
            <div class="profile-id">
              <h3 id="name"></h3>
              <p id="login"></p>
            </div>
          </div>

          <p id="bio"></p>

          <div class="stats">
            <div class="stat">
              <span class="stat-value" id="repos">0</span>
              <span class="stat-label">REPOS</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="followers">0</span>
              <span class="stat-label">FOLLOWERS</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="following">0</span>
              <span class="stat-label">FOLLOWING</span>
            </div>
          </div>

          <a id="profileLink" href="#" target="_blank">View on GitHub →</a>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
